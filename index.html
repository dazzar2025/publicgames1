<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#faf6ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Merge 2048 — swipe to slide tiles and merge matching numbers. Free, works on phone and desktop.">
<title>Merge 2048</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23f2b179'/><text x='50' y='64' font-size='38' font-family='Arial' font-weight='bold' text-anchor='middle' fill='white'>2048</text></svg>">
<style>
  :root{
    --bg:#faf6ee; --ink:#4a4036; --muted:#9a8c7d; --board:#bcad9e; --cell:#d7cbbd;
    --gap:10px; --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none}
  body{display:flex;flex-direction:column;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none}
  .wrap{width:min(100%, 480px);display:flex;flex-direction:column;gap:14px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px}
  h1{font-size:clamp(34px,10vw,52px);font-weight:800;letter-spacing:-1px;line-height:1}
  .scores{display:flex;gap:6px}
  .score{background:var(--board);color:#fff;border-radius:8px;padding:6px 12px;text-align:center;min-width:72px;position:relative}
  .score span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#f4ece2;font-weight:700}
  .score b{font-size:20px}
  .plus{position:absolute;left:0;right:0;top:20px;font-weight:800;color:var(--ink);animation:rise .7s ease-out forwards;pointer-events:none}
  @keyframes rise{to{transform:translateY(-36px);opacity:0}}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .bar p{color:var(--muted);font-size:14px;line-height:1.3}
  .btns{display:flex;gap:6px;flex-shrink:0}
  button{font:inherit;border:0;border-radius:8px;background:#8f7a66;color:#fff;font-weight:700;padding:10px 14px;cursor:pointer;font-size:15px}
  button:active{transform:scale(.96)}
  button:disabled{opacity:.4}
  .board{position:relative;width:100%;aspect-ratio:1;background:var(--board);border-radius:var(--radius);padding:var(--gap);touch-action:none}
  .grid{position:absolute;inset:var(--gap);display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:var(--gap)}
  .grid div{background:var(--cell);border-radius:6px}
  .tiles{position:absolute;inset:var(--gap)}
  .tile{position:absolute;width:calc((100% - 3*var(--gap))/4);height:calc((100% - 3*var(--gap))/4);transition:transform .11s ease-in-out;z-index:1}
  .tile .in{width:100%;height:100%;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:var(--fs,40px);background:#eee4da;color:#776e65}
  .tile.new .in{animation:appear .18s ease .08s backwards}
  .tile.merged{z-index:2}
  .tile.merged .in{animation:pop .2s ease .08s backwards}
  @keyframes appear{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes pop{0%{transform:scale(0)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
  .v2 .in{background:#eee4da;color:#776e65}
  .v4 .in{background:#ede0c8;color:#776e65}
  .v8 .in{background:#f2b179;color:#fff}
  .v16 .in{background:#f59563;color:#fff}
  .v32 .in{background:#f67c5f;color:#fff}
  .v64 .in{background:#f65e3b;color:#fff}
  .v128 .in{background:#edcf72;color:#fff;box-shadow:0 0 18px rgba(243,215,116,.4)}
  .v256 .in{background:#edcc61;color:#fff;box-shadow:0 0 22px rgba(243,215,116,.5)}
  .v512 .in{background:#edc850;color:#fff;box-shadow:0 0 26px rgba(243,215,116,.6)}
  .v1024 .in{background:#edc53f;color:#fff;box-shadow:0 0 30px rgba(243,215,116,.7)}
  .v2048 .in{background:#edc22e;color:#fff;box-shadow:0 0 36px rgba(243,215,116,.85)}
  .vbig .in{background:#3c3a32;color:#fff}
  .overlay{position:absolute;inset:0;border-radius:var(--radius);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:10;animation:fade .4s ease}
  .overlay.show{display:flex}
  .overlay.lose{background:rgba(238,228,218,.78)}
  .overlay.win{background:rgba(237,194,46,.55);color:#fff}
  .overlay h2{font-size:clamp(32px,9vw,48px);font-weight:800}
  .overlay .row{display:flex;gap:8px}
  @keyframes fade{from{opacity:0}}
  .help{color:var(--muted);font-size:13px;text-align:center;line-height:1.5}
  .more{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .more a{color:#8f7a66;font-weight:700;font-size:13px;text-decoration:none;border:1px solid #d7cbbd;border-radius:20px;padding:6px 12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>2048</h1>
    <div class="scores">
      <div class="score" id="scoreBox"><span>Score</span><b id="score">0</b></div>
      <div class="score"><span>Best</span><b id="best">0</b></div>
    </div>
  </header>
  <div class="bar">
    <p>Merge matching tiles to reach <strong>2048</strong>!</p>
    <div class="btns">
      <button id="undo" disabled title="Undo last move">↶ Undo</button>
      <button id="newGame">New</button>
    </div>
  </div>
  <div class="board" id="board">
    <div class="grid" id="grid"></div>
    <div class="tiles" id="tiles"></div>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">Game over</h2>
      <div class="row" id="ovButtons"></div>
    </div>
  </div>
  <p class="help"><strong>How to play:</strong> swipe on the board (or use arrow keys / WASD). Tiles with the same number merge into one when they touch.</p>
  <div class="more">
    <a href="https://dazzar2025.github.io/publicgames2/">🐍 Neon Snake</a>
    <a href="https://dazzar2025.github.io/publicgames3/">🏗️ Sky Stack</a>
  </div>
</div>
<script>
(() => {
  const SIZE = 4;
  const tilesEl = document.getElementById('tiles');
  const gridEl = document.getElementById('grid');
  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const scoreBox = document.getElementById('scoreBox');
  const undoBtn = document.getElementById('undo');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovButtons = document.getElementById('ovButtons');

  for (let i = 0; i < SIZE * SIZE; i++) gridEl.appendChild(document.createElement('div'));

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  let tiles = [];        // {id, v, r, c, el}
  let nextId = 1;
  let score = 0;
  let best = store.get('m2048-best', 0);
  let won = false, keepPlaying = false, over = false;
  let prev = null;       // snapshot for undo
  let busy = false;
  bestEl.textContent = best;

  function cellSize() {
    const w = tilesEl.clientWidth;
    const gap = parseFloat(getComputedStyle(boardEl).getPropertyValue('--gap')) || 10;
    return { s: (w - gap * (SIZE - 1)) / SIZE, gap };
  }
  function place(t) {
    const { s, gap } = cellSize();
    t.el.style.transform = `translate(${t.c * (s + gap)}px, ${t.r * (s + gap)}px)`;
  }
  function fontFor(v, s) {
    const digits = String(v).length;
    const f = digits <= 2 ? 0.48 : digits === 3 ? 0.4 : digits === 4 ? 0.32 : 0.26;
    return Math.round(s * f) + 'px';
  }
  function makeEl(t, cls) {
    const el = document.createElement('div');
    el.className = 'tile ' + (t.v > 2048 ? 'vbig' : 'v' + t.v) + (cls ? ' ' + cls : '');
    const inner = document.createElement('div');
    inner.className = 'in';
    inner.textContent = t.v;
    el.appendChild(inner);
    t.el = el;
    const { s } = cellSize();
    el.style.setProperty('--fs', fontFor(t.v, s));
    el.style.transition = 'none';
    place(t);
    tilesEl.appendChild(el);
    void el.offsetWidth;
    el.style.transition = '';
    return el;
  }
  function layoutAll() {
    const { s } = cellSize();
    tiles.forEach(t => { t.el.style.transition = 'none'; t.el.style.setProperty('--fs', fontFor(t.v, s)); place(t); void t.el.offsetWidth; t.el.style.transition = ''; });
  }

  function emptyCells() {
    const occ = new Set(tiles.map(t => t.r * SIZE + t.c));
    const out = [];
    for (let i = 0; i < SIZE * SIZE; i++) if (!occ.has(i)) out.push(i);
    return out;
  }
  function addRandom() {
    const e = emptyCells();
    if (!e.length) return;
    const i = e[Math.floor(Math.random() * e.length)];
    const t = { id: nextId++, v: Math.random() < 0.9 ? 2 : 4, r: Math.floor(i / SIZE), c: i % SIZE };
    tiles.push(t);
    makeEl(t, 'new');
  }

  function setScore(s, gained) {
    score = s;
    scoreEl.textContent = score;
    if (gained > 0) {
      const p = document.createElement('div');
      p.className = 'plus'; p.textContent = '+' + gained;
      scoreBox.appendChild(p);
      setTimeout(() => p.remove(), 700);
    }
    if (score > best) { best = score; bestEl.textContent = best; store.set('m2048-best', best); }
  }

  function snapshot() { return { tiles: tiles.map(t => ({ v: t.v, r: t.r, c: t.c })), score, won, keepPlaying }; }
  function restore(snap) {
    tilesEl.innerHTML = '';
    tiles = snap.tiles.map(t => ({ ...t, id: nextId++ }));
    tiles.forEach(t => makeEl(t));
    won = snap.won; keepPlaying = snap.keepPlaying; over = false;
    setScore(snap.score, 0);
    hideOverlay();
  }
  function save() { store.set('m2048-state', snapshot()); }

  function newGame() {
    tilesEl.innerHTML = '';
    tiles = []; won = false; keepPlaying = false; over = false; prev = null;
    undoBtn.disabled = true;
    setScore(0, 0);
    hideOverlay();
    addRandom(); addRandom();
    save();
  }

  // dir: 0 up, 1 right, 2 down, 3 left
  function move(dir) {
    if (busy || over || (won && !keepPlaying)) return;
    const grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
    tiles.forEach(t => grid[t.r][t.c] = t);
    const before = snapshot();
    let moved = false, gained = 0;
    const removed = [], created = [];
    for (let i = 0; i < SIZE; i++) {
      const cells = [];
      for (let k = 0; k < SIZE; k++) {
        if (dir === 0) cells.push([k, i]);
        else if (dir === 2) cells.push([SIZE - 1 - k, i]);
        else if (dir === 3) cells.push([i, k]);
        else cells.push([i, SIZE - 1 - k]);
      }
      let pos = 0, last = null;
      for (const [r, c] of cells) {
        const t = grid[r][c];
        if (!t) continue;
        if (last && last.v === t.v) {
          const [dr, dc] = cells[pos - 1];
          t.r = dr; t.c = dc; moved = true;
          removed.push(t, last);
          created.push({ v: t.v * 2, r: dr, c: dc });
          gained += t.v * 2;
          last = null;
        } else {
          const [dr, dc] = cells[pos];
          if (t.r !== dr || t.c !== dc) moved = true;
          t.r = dr; t.c = dc; last = t; pos++;
        }
      }
    }
    if (!moved) { nudge(dir); return; }
    prev = before; undoBtn.disabled = false;
    busy = true;
    tiles.forEach(place);
    setTimeout(() => {
      removed.forEach(t => t.el.remove());
      tiles = tiles.filter(t => !removed.includes(t));
      created.forEach(n => {
        const t = { id: nextId++, ...n };
        tiles.push(t);
        makeEl(t, 'merged');
        if (t.v === 2048 && !won) won = true;
      });
      setScore(score + gained, gained);
      addRandom();
      busy = false;
      if (won && !keepPlaying && created.some(n => n.v === 2048)) showWin();
      else if (!canMove()) showLose();
      save();
    }, 115);
  }

  function nudge(dir) {
    const dx = [0, 6, 0, -6][dir], dy = [-6, 0, 6, 0][dir];
    tilesEl.animate([{ transform: 'translate(0,0)' }, { transform: `translate(${dx}px,${dy}px)` }, { transform: 'translate(0,0)' }], { duration: 140 });
  }

  function canMove() {
    if (emptyCells().length) return true;
    const g = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    tiles.forEach(t => g[t.r][t.c] = t.v);
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      if (c + 1 < SIZE && g[r][c] === g[r][c + 1]) return true;
      if (r + 1 < SIZE && g[r][c] === g[r + 1][c]) return true;
    }
    return false;
  }

  function btn(label, fn) { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; return b; }
  function showLose() {
    over = true;
    overlay.className = 'overlay lose show';
    ovTitle.textContent = 'Game over!';
    ovButtons.innerHTML = '';
    if (prev) ovButtons.appendChild(btn('↶ Undo', undo));
    ovButtons.appendChild(btn('Try again', newGame));
  }
  function showWin() {
    overlay.className = 'overlay win show';
    ovTitle.textContent = 'You win! 🎉';
    ovButtons.innerHTML = '';
    ovButtons.appendChild(btn('Keep going', () => { keepPlaying = true; hideOverlay(); save(); }));
    ovButtons.appendChild(btn('New game', newGame));
  }
  function hideOverlay() { overlay.className = 'overlay'; }

  function undo() {
    if (!prev || busy) return;
    restore(prev);
    prev = null; undoBtn.disabled = true;
    save();
  }

  undoBtn.onclick = undo;
  document.getElementById('newGame').onclick = newGame;

  document.addEventListener('keydown', e => {
    const map = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3, w: 0, d: 1, s: 2, a: 3, W: 0, D: 1, S: 2, A: 3 };
    if (e.key in map) { e.preventDefault(); move(map[e.key]); }
    else if ((e.key === 'z' || e.key === 'Z') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); undo(); }
  });

  // swipe
  let sx = 0, sy = 0, tracking = false;
  boardEl.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; tracking = true; sx = e.clientX; sy = e.clientY; });
  boardEl.addEventListener('pointerup', e => {
    if (!tracking) return; tracking = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (Math.max(ax, ay) < 24) return;
    if (ax > ay) move(dx > 0 ? 1 : 3); else move(dy > 0 ? 2 : 0);
  });
  boardEl.addEventListener('pointercancel', () => tracking = false);
  document.addEventListener('touchmove', e => { if (e.target.closest('.board')) e.preventDefault(); }, { passive: false });

  window.addEventListener('resize', layoutAll);

  // resume saved game
  const saved = store.get('m2048-state', null);
  if (saved && saved.tiles && saved.tiles.length) {
    restore(saved);
    if (!canMove()) showLose();
  } else newGame();
})();
</script>
</body>
</html>
